<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful – ReadyBrainAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #08090a;
            color: #e8eaed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #1a1c1e;
            border: 1px solid #2e3034;
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .icon { font-size: 56px; margin-bottom: 20px; }
        .title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: #f8f9fa;
            margin-bottom: 12px;
        }
        .msg {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #00e87a;
            color: #08090a;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 15px;
            border-radius: 999px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #00c064; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎉</div>
        <div class="title">You're Premium!</div>
        <p class="msg">Your payment was successful. You now have unlimited access to ReadyBrainAI — no ads, no limits. Go ace that interview!</p>
        <a href="/listen" class="btn">Start Practicing →</a>
    </div>
</body>
</html>
